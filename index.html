<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Water Glass — AI water-use simulator</title>
    <meta
      name="description"
      content="A skeuomorphic simulator of cited AI query and data-center water figures. The glass fills from published numbers."
    />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="desk">
      <div class="device">
        <header class="nav">
          <div>
            <p class="nav-kicker">Utilities</p>
            <h1>Water Glass</h1>
          </div>
          <button type="button" class="nav-btn" id="open-sources">Sources</button>
        </header>
        <div class="segmented" role="tablist" aria-label="What to pour">
          <button type="button" id="tab-datacenter" role="tab" aria-selected="false">Data Centers</button>
          <button type="button" id="tab-model" role="tab" aria-selected="true">AI Models</button>
        </div>
        <div class="workspace">
          <section class="stage" aria-label="Sink">
            <div class="bench" id="scene" data-state="idle" data-menu="model" data-level="0">
              <div class="set">
              <div class="backsplash" aria-hidden="true"></div>
              <div class="faucet" aria-hidden="true">
                <svg class="faucet-svg" viewBox="0 0 320 150">
                  <defs>
                    <linearGradient id="chromeH" x1="0" y1="0" x2="1" y2="0">
                      <stop offset="0" stop-color="#4e545c"/>
                      <stop offset="0.16" stop-color="#f7f8fa"/>
                      <stop offset="0.34" stop-color="#8e969f"/>
                      <stop offset="0.52" stop-color="#ffffff"/>
                      <stop offset="0.7" stop-color="#5e666f"/>
                      <stop offset="0.86" stop-color="#e7eaee"/>
                      <stop offset="1" stop-color="#6a717a"/>
                    </linearGradient>
                    <linearGradient id="chromeV" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0" stop-color="#ffffff"/>
                      <stop offset="0.35" stop-color="#c5cad1"/>
                      <stop offset="0.7" stop-color="#6d747d"/>
                      <stop offset="1" stop-color="#eef1f4"/>
                    </linearGradient>
                    <radialGradient id="escutcheon" cx="40%" cy="35%" r="70%">
                      <stop offset="0" stop-color="#ffffff"/>
                      <stop offset="0.45" stop-color="#b7bec6"/>
                      <stop offset="1" stop-color="#5a616a"/>
                    </radialGradient>
                  </defs>
                  <ellipse cx="54" cy="36" rx="34" ry="16" fill="url(#escutcheon)"/>
                  <ellipse cx="54" cy="34" rx="22" ry="8" fill="#f4f6f8" opacity=".55"/>
                  <g class="handle">
                    <rect x="14" y="6" width="86" height="14" rx="7" fill="url(#chromeV)" stroke="#8b929b" stroke-width="0.6"/>
                    <circle cx="96" cy="13" r="7.5" fill="#f7f8fa" stroke="#9aa1a8"/>
                    <circle cx="96" cy="13" r="2.4" fill="#5c636c"/>
                  </g>
                  <path d="M54 42 v28" stroke="#2c3138" stroke-width="22" stroke-linecap="round"/>
                  <path d="M54 48 H168 Q236 48 236 112" fill="none" stroke="#2c3138" stroke-width="22" stroke-linecap="round"/>
                  <path d="M54 42 v28" stroke="url(#chromeH)" stroke-width="16" stroke-linecap="round"/>
                  <path d="M54 48 H168 Q236 48 236 112" fill="none" stroke="url(#chromeH)" stroke-width="16" stroke-linecap="round"/>
                  <path d="M54 40 H164 Q226 40 226 104" fill="none" stroke="rgba(255,255,255,.78)" stroke-width="3" stroke-linecap="round"/>
                  <rect x="226" y="108" width="20" height="18" rx="4" fill="url(#chromeV)"/>
                  <rect x="229" y="114" width="14" height="3" rx="1" fill="#3c424a" opacity=".55"/>
                  <rect x="229" y="119" width="14" height="2" rx="1" fill="#3c424a" opacity=".35"/>
                </svg>
                <div class="aerator">
                  <div class="stream" id="stream" hidden></div>
                  <div class="drops" id="drops"></div>
                </div>
              </div>
              <div class="cup-rig">
                <div class="cup" id="cup">
                  <ol class="ticks" id="ticks"></ol>
                  <div class="glass">
                    <div class="water" id="water">
                      <span class="meniscus"></span>
                      <span class="caustic"></span>
                    </div>
                    <div class="glass-shine"></div>
                    <div class="glass-edge"></div>
                  </div>
                  <div class="rim"></div>
                  <div class="foot"></div>
                  <div class="spill" id="spill" hidden></div>
                </div>
              </div>
              <div class="sink" aria-hidden="true">
                <div class="counter"></div>
                <div class="basin">
                  <div class="wet"></div>
                </div>
                <div class="drain">
                  <span class="ripple"></span>
                  <span class="ripple delay"></span>
                  <span class="grate"></span>
                </div>
              </div>
              </div>
            </div>
            <div class="plaque" id="plaque" aria-live="polite"></div>
            <p class="legend" id="legend"></p>
          </section>
          <section class="picker-wrap" aria-label="Choose a figure">
            <div class="picker" id="picker" role="listbox"></div>
          </section>
        </div>
        <div class="chin" aria-hidden="true"><span class="home"></span></div>
      </div>
    </div>
    <dialog id="sources">
      <div class="sheet">
        <header class="sheet-bar">
          <h2>Sources</h2>
          <button type="button" class="nav-btn" id="close-sources">Done</button>
        </header>
        <div id="sources-body" class="sheet-body"></div>
      </div>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
