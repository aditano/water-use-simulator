<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Water Glass — AI water-use simulator</title>
    <meta
      name="description"
      content="A 3D studio glass that fills from cited AI query and data-center water figures."
    />
    <meta name="theme-color" content="#090b10" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="app">
      <div id="scene" class="stage" data-state="idle" data-level="0" data-overflow="false" data-menu="model" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <header class="brand glass-panel">
        <p class="kicker">Utilities</p>
        <h1>Water Glass</h1>
      </header>
      <div class="tabs glass-panel" role="tablist" aria-label="What to pour">
        <button type="button" id="tab-datacenter" role="tab" aria-selected="false">Data Centers</button>
        <button type="button" id="tab-model" role="tab" aria-selected="true">AI Models</button>
      </div>
      <aside class="glass-panel side" aria-label="Choose a figure">
        <div class="side-bar">
          <p>Figures</p>
          <button type="button" class="text-btn" id="open-sources">Sources</button>
        </div>
        <div id="picker" class="picker" role="listbox"></div>
      </aside>
      <section class="glass-panel readouts" aria-label="Selected figure">
        <div id="plaque" aria-live="polite"></div>
        <p id="legend" class="legend"></p>
      </section>
    </div>
    <dialog id="sources">
      <div class="sheet">
        <header class="sheet-bar">
          <h2>Sources</h2>
          <button type="button" class="text-btn" id="close-sources">Done</button>
        </header>
        <div id="sources-body" class="sheet-body"></div>
      </div>
    </dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
